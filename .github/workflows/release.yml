name: Release Standalone Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Distribution
        run: |
          python build.py

      - name: Archive Release Bundle (ZIP)
        run: |
          powershell -Command "
          $version = '${{ github.ref_name }}'
          if (-not $version) { $version = 'manual' }
          $zipName = \"VoiceAlert-Windows-x64-${version}.zip\"
          Compress-Archive -Path 'release\VoiceAlert\*' -DestinationPath $zipName
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          Set-Content -Path \"${zipName}.sha256\" -Value \"$hash  $zipName\"
          Write-Host \"Created package: $zipName with SHA256: $hash\"
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VoiceAlert-Windows-x64-*.zip
            VoiceAlert-Windows-x64-*.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
